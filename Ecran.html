<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prochains départs — Transport du jour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
  :root{
    --primary:#0055b2; --white:#ffffff; --ink:#181a1e; --text:#22252b; --muted:#44474f; --grey:#eef2f6;
    --font:Manrope,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--primary);overflow:hidden;font-family:var(--font)}
  /* Scène fixe 1920×1080, mise à l'échelle de l'écran */
  #stage{position:absolute;top:50%;left:50%;width:1920px;height:1080px;transform-origin:center center;
    background:var(--primary);color:var(--white);display:flex;flex-direction:column;padding:40px 56px 48px;gap:32px}
  header{display:flex;align-items:center;gap:36px;flex-shrink:0}
  header img{height:84px;width:auto}
  .sep{width:2px;height:64px;background:rgba(255,255,255,.35)}
  h1{margin:0;font-size:52px;line-height:1.1;font-weight:700;letter-spacing:-.03em}
  .grow{flex-grow:1}
  .clock{display:flex;flex-direction:column;align-items:flex-end}
  .clock .h{font-size:64px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .clock .d{font-size:22px;font-weight:600}
  main{flex-grow:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:32px}
  .left{display:flex;flex-direction:column;gap:24px;min-height:0}
  .hero{flex-grow:1;background:var(--white);color:var(--ink);border-radius:34px;padding:44px 52px;display:flex;flex-direction:column;justify-content:space-between}
  .hero .top{display:flex;align-items:center;justify-content:space-between}
  .label{font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .hero .label{color:var(--muted)}
  .badge{border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;letter-spacing:-.02em}
  .badge small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .hero .badge{height:72px;padding:0 32px;border-radius:24px;font-size:48px}
  .hero .badge small{font-size:16px}
  .hero .time{font-size:168px;font-weight:700;letter-spacing:-.05em;line-height:1}
  .hero .grp{font-size:60px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
  .hero .route{font-size:36px;font-weight:600;line-height:1.2;color:var(--text);margin-top:8px}
  .hero .meta{font-size:22px;font-weight:600;color:var(--muted);margin-top:8px}
  .empty{flex-grow:1;border-radius:34px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700;letter-spacing:-.02em}
  .next{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;flex-shrink:0}
  .card{background:var(--white);color:var(--ink);border-radius:28px;padding:24px 28px;display:flex;flex-direction:column;gap:8px}
  .card .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .card .time{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .card .badge{height:52px;padding:0 20px;font-size:32px}
  .card .grp{font-size:28px;font-weight:700}
  .card .sub{font-size:20px;font-weight:600;color:var(--muted)}
  .right{display:flex;flex-direction:column;gap:20px;min-height:0;overflow:hidden}
  .live{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.12);border-radius:20px;padding:14px 18px}
  .chip{width:96px;height:48px;flex-shrink:0;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
  .txt{min-width:0;display:flex;flex-direction:column}
  .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live .a{font-size:22px;font-weight:700}
  .live .b{font-size:17px;font-weight:600}
  .rule{height:2px;background:rgba(255,255,255,.35);margin:8px 0;flex-shrink:0}
  .later{display:flex;align-items:center;gap:16px;padding:4px 0}
  .later .t{width:120px;flex-shrink:0;font-size:28px;font-weight:700;letter-spacing:-.02em}
  .later .chip{height:44px;font-size:24px}
  .later .g{min-width:0;flex:1;font-size:22px;font-weight:600}
  .none{font-size:20px;font-weight:600;opacity:.8}
  /* Bande réservée au bandeau de Vivi, en bas de l'écran */
  #stage{padding-bottom:240px}
</style>
</head>

const fmt = (m) => Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0');
const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const badge = (b) => `<div class="badge" style="background:${b.bg};color:${b.fg}"><small>${b.prefixe}</small>${esc(b.numero)}</div>`;
const chip = (b) => `<div class="chip" style="background:${b.bg};color:${b.fg}">${b.court}</div>`;

function compte(d, now) {
  const m = d - now;
  if (m < 1) return 'maintenant';
  if (m < 60) return 'dans ' + m + ' min';
  return 'dans ' + Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0');
}

function preparer(t) {
  return { d: min(t.depart), f: min(t.fin), b: BUS[t.bus] || { prefixe: 'Autobus', numero: t.bus || '?', court: t.bus || '?', bg: '#44474f', fg: '#ffffff' },
           chauffeur: t.chauffeur || '—', groupe: t.groupe || 'Trajet', origine: t.origine || '—',
           destination: t.destination || '—', note: t.note || '' };
}

function rendre() {
  const maintenant = new Date();
  const now = maintenant.getHours() * 60 + maintenant.getMinutes();
  const auj = iso(maintenant);
  const dem = new Date(maintenant); dem.setDate(dem.getDate() + 1);

  $('heure').textContent = fmt(now);
  const date = maintenant.toLocaleDateString('fr-CA', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  $('date').textContent = date.charAt(0).toUpperCase() + date.slice(1);

  const jour = DONNEES.trajets.filter((t) => t.date === auj).map(preparer).sort((a, b) => a.d - b.d);
  const demain = DONNEES.trajets.filter((t) => t.date === iso(dem)).map(preparer).sort((a, b) => a.d - b.d);

  const avenir = jour.filter((t) => t.d > now);
  const enRoute = jour.filter((t) => t.d <= now && t.f > now);
  const p = avenir[0];

  if (p) {
    $('hero').className = 'hero';
    $('hero').innerHTML = `
      <div class="top">
        <div class="label">Prochain départ · ${compte(p.d, now)}</div>
        ${badge(p.b)}
      </div>
      <div class="time">${fmt(p.d)}</div>
      <div>
        <div class="grp">${esc(p.groupe)}</div>
        <div class="route">${esc(p.origine)} → ${esc(p.destination)}</div>
        <div class="meta">Chauffeur : ${esc(p.chauffeur)} · fin prévue ${fmt(p.f)}${p.note ? ' · ' + esc(p.note) : ''}</div>
      </div>`;
  } else if (!CHARGE) {
    $('hero').className = 'empty';
    $('hero').innerHTML = 'Chargement de l’horaire…';
  } else {
    const q = demain[0];
    $('hero').className = 'empty';
    $('hero').innerHTML = `<div style="text-align:center">
        <div>Aucun autre départ aujourd’hui</div>
        ${q ? `<div style="font-size:30px;font-weight:600;margin-top:16px">Premier départ demain : ${fmt(q.d)} · ${esc(q.b.prefixe)} ${esc(q.b.numero)} · ${esc(q.groupe)}</div>` : ''}
      </div>`;
  }

  $('ensuite').innerHTML = avenir.slice(1, 3).map((t) => `
    <div class="card">
      <div class="row"><div class="time">${fmt(t.d)}</div>${badge(t.b)}</div>
      <div class="grp ell">${esc(t.groupe)}</div>
      <div class="sub ell">→ ${esc(t.destination)} · ${compte(t.d, now)}</div>
    </div>`).join('');

  $('enroute').innerHTML = enRoute.length ? enRoute.map((t) => `
    <div class="live">${chip(t.b)}
      <div class="txt"><div class="a ell">${esc(t.groupe)}</div>
      <div class="b ell">${esc(t.destination)} · jusqu’à ${fmt(t.f)}</div></div>
    </div>`).join('') : '<div class="none">Aucun autobus en route</div>';

  const rest = avenir.slice(3);
  $('plustard').innerHTML = rest.length ? rest.map((t) => `
    <div class="later"><div class="t">${fmt(t.d)}</div>${chip(t.b)}
      <div class="g ell">${esc(t.groupe)} → ${esc(t.destination)}</div></div>`).join('')
    : '<div class="none">Rien d’autre de prévu</div>';

  if (DONNEES.derniereSynchro) {
    const s = new Date(DONNEES.derniereSynchro);
    $('synchro').textContent = 'Horaire mis à jour le ' + s.toLocaleDateString('fr-CA', { day: 'numeric', month: 'long' }) + ' à ' + fmt(s.getHours() * 60 + s.getMinutes());
  }
}

// Les données arrivent par une balise <script> (JSONP) : fonctionne même dans l'aperçu OneDrive/SharePoint
function recevoirDonnees(d) {
  if (d && Array.isArray(d.trajets)) { DONNEES = d; CHARGE = true; }
  rendre();
}

function charger() {
  // Page servie par Apps Script : appel direct au script
  if (window.google && google.script && google.script.run) {
    google.script.run.withSuccessHandler(recevoirDonnees).withFailureHandler(() => rendre()).getDonnees();
    return;
  }
  // Copie locale du fichier : chargement par balise <script>
  const s = document.createElement('script');
  s.src = URL_DONNEES + '?callback=recevoirDonnees&t=' + Date.now();
  s.onload = s.onerror = () => s.remove();   // en cas d'échec, on garde les dernières données reçues
  document.body.appendChild(s);
}

function ajuster() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  $('stage').style.transform = `translate(-50%, -50%) scale(${s})`;
}

window.addEventListener('resize', ajuster);
ajuster();
rendre();
charger();
setInterval(rendre, 20000);
setInterval(charger, RAFRAICHIR_MIN * 60000);
</script>
</body>
</html>
